<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        background: #fdfcf9;
        color: #1f2933;
        padding: 28px;
        font-size: 20px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .big { font-size: 34px; }
      .bold { font-weight: 700; }
      .italic { font-style: italic; }
      .underline { text-decoration: underline; }
      .strike { text-decoration: line-through; }
      .tinted { color: #b91c1c; }
      .centered { text-align: center; }
      .spaced { letter-spacing: 4px; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="big bold">Big and bold</div>
      <div class="italic">Italic, probably synthesized</div>
      <div class="underline">Underlined text</div>
      <div class="strike">Struck through text</div>
      <div class="tinted">Coloured text</div>
      <div class="centered">Centered in the block</div>
      <div class="spaced">letter spaced</div>
    </div>
  </body>
</html>
