<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>What a page says when its scripts do not run</title>
    <style>body { margin: 0; font: 16px/20px monospace }</style>
  </head>
  <body>
    <p id="always">always here</p>
    <!--
      The one element whose rendering is about the browser rather than the
      document: shown when scripting is off, hidden when it is on. A browser
      that never says which draws this over the page it was the fallback for.
    -->
    <noscript><p id="fallback">turn JavaScript on</p></noscript>
  </body>
</html>
