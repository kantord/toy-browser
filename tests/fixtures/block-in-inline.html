<!DOCTYPE html>
<html>
  <head>
    <style>
      body { margin: 0; font: 16px/20px sans-serif }
      /* The span is split by the div: what CSS requires is an anonymous block
         holding "one", then the div, then another holding "three". */
      span { background: rgb(204, 255, 204) }
      div { background: rgb(204, 204, 255) }
    </style>
  </head>
  <body><span>one<div>two</div>three</span></body>
</html>
