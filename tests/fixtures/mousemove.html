<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A page that changes itself under the pointer</title>
    <style>
      body { margin: 0; font: 48px/1.4 monospace; padding: 20px }
      #pad { width: 600px; height: 400px; background: #eee }
    </style>
  </head>
  <body>
    <!-- One element, so the hovered element never changes and the only reason
         to redraw is that the page altered itself. -->
    <div id="pad">moves: <span id="count">0</span></div>
    <script>
      let moves = 0;
      document.getElementById("pad").addEventListener("mousemove", () => {
        document.getElementById("count").textContent = ++moves;
      });
    </script>
  </body>
</html>
