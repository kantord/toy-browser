<!doctype html><html><head><meta charset=utf-8><style>
table.a{border-collapse:collapse}
table.a th,table.a td{border:1px solid #a2a9b1;padding:4px 8px}
table.b th,table.b td{border:1px solid #c00;padding:4px 8px}
</style></head><body style="font:16px sans-serif;margin:8px">
<p>collapse:</p>
<table class=a><tr><th>H1</th><th>H2</th></tr><tr><td>a</td><td>b</td></tr></table>
<p>separate:</p>
<table class=b><tr><th>H1</th><th>H2</th></tr><tr><td>a</td><td>b</td></tr></table>
</body></html>
