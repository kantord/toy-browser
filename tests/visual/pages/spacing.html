<!doctype html>
<!-- Guards: spacing. Pixel margins sized for a screen of pixels would swallow a
     terminal: 96px above and below a section is a few rows, not six; 4px
     between inline links is still one column.

     Features:
     css/vertical-spacing-scaled: supported
     css/inline-gap-minimum: supported
-->
<style>
  body { margin: 0 } section { margin: 96px 0; padding: 0 16px }
  nav a { margin-right: 4px } nav { display: flex; gap: 4px }
</style>
<nav><a href="#a">Donate</a><a href="#b">Create account</a><a href="#c">Log in</a></nav>
<section>Section one</section>
<section>Section two</section>
