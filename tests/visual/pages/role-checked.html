<!doctype html>
<!-- Guards: controls built from a button and ARIA. A checked checkbox, switch
     or radio says so: [x], not an empty [].

     Features:
     html/aria-checked-controls: unsupported -->
<style>body{margin:0}</style>
<p><button role="checkbox" aria-checked="true" aria-label="Accept"></button> accepted
<button role="checkbox" aria-checked="false" aria-label="Spam"></button> not
<button role="switch" aria-checked="true" aria-label="Wifi"></button> on</p>
