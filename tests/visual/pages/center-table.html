<!doctype html>
<!-- Guards: <center> and tables. The legacy centring of <center> places a table
     in the middle of the row as well as the text in it; the table was left at the
     left edge, so a centred search form sat off to one side.

     Features:
     html/center-table: supported -->
<style>body{margin:0;width:400px}</style>
<center><div>title</div>
<table><tr><td>one</td><td>two</td></tr></table>
<div>after</div></center>
<table><tr><td>not centred</td></tr></table>
