<!doctype html>
<!-- Guards: display: contents. A wrapper that generates no box hands its
     children to the parent, so they lay out as the flex row's own items. -->
<style>body { margin: 0 } .row { display: flex; gap: 8px; background: #eef } .wrap { display: contents }</style>
<div class="row"><span>left</span><div class="wrap"><span>mid-1</span><span>mid-2</span></div><span>right</span></div>
