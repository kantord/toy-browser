<!doctype html>
<!-- Guards: borders. Lines that meet join with junction glyphs, not a pile of
     corners.

     Features:
     css/border-junctions: supported
-->
<style>body { margin: 0 } table { border-collapse: collapse } td { border: 1px solid #000; padding: 0 1ch }</style>
<table><tr><td>one</td><td>two</td><td>three</td></tr><tr><td>four</td><td>five</td><td>six</td></tr></table>
