<!doctype html>
<!-- Guards: contrast. Light text on a dark footer, links included, stays
     light; dark-on-dark came from inheriting the wrong colour. -->
<style>
  body { margin: 0; color: #222 } footer { background: #1b1f2a; color: #e8eaf0; padding: 0 2ch }
  footer a { color: #9ecbff }
</style>
<p>Body text.</p>
<footer>Footer words <a href="#a">footer link</a> and <b>bold</b> too.</footer>
