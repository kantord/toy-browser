<!doctype html>
<!-- Guards: text-indent. A first-line indent is drawn; a hanging one (a
     negative indent) is a known limit, the first line is indented like the rest.

     Features:
     css/text-indent: supported
     css/text-indent-hanging: unsupported -->
<style>body{margin:0;width:320px}</style>
<p style="text-indent:32px">first line indented, the paragraph wraps around the edge of the box</p>
<p style="padding-left:32px;text-indent:-32px">hanging indent, the paragraph wraps around the edge of the box</p>
