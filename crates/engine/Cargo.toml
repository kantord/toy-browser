[package]
name = "toy-browser-engine"
description = "The smallest set of operations a browser automation API can be built on."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
toy-browser-fetch.workspace = true
serde_json.workspace = true
blitz-dom = { path = "../../vendor/blitz-dom", default-features = false, features = [
    "floats",
    "svg",
    "woff",
    "system-fonts",
    "file-input",
] }
blitz-html = { path = "../../vendor/blitz-html" }
rquickjs = { version = "0.12.2", features = ["macro", "classes", "properties", "loader"], optional = true }
xml5ever = "0.39"
html5ever = "0.39"

[features]
# The JavaScript interpreter. Without it a page is parsed, laid out and acted on
# (clicks, focus, typing into fields) but its scripts are not run, and
# `evaluate` answers that there is nothing to run them with.
default = ["quickjs"]
quickjs = ["dep:rquickjs"]

[lints]
workspace = true

# A build for the web has no operating system to ask for randomness, so the two
# `getrandom` versions in this tree both need their browser backend turned on.
# Target-gated: a native build is untouched.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
