[package]
name = "toy-browser"
description = "Pages, elements, measuring and rendering, built on the engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
blitz-dom = { version = "0.3.0-beta.2", features = ["floats"] }
blitz-html = "0.3.0-beta.2"
blitz-traits = "0.3.0-beta.2"
# The cursor a page asks for. blitz answers in this crate's type and winit
# takes the same one, so naming it here is what lets the answer travel.
cursor-icon = "1.2"
parley = { version = "0.11.1", default-features = false, features = ["std"] }
style = { package = "stylo", version = "0.20" }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
serde_json.workspace = true
toy-browser-engine.workspace = true
toy-browser-fetch.workspace = true
resvg = "0.48.1"
url = "2.5.8"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
base64 = "0.22"
# Never named in this crate's code. It is here to turn decoders on for
# blitz-dom, which depends on `image` with `default-features = false` and so
# cannot decode any format at all — an `<img>` with no width or height then
# measures 0x0 and is never drawn. Cargo unifies features across the graph, so
# asking for them here is what gives blitz a decoder.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
app_units = "0.7.8"
euclid = "0.22.14"

[lints]
workspace = true
