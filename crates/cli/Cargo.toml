[package]
name = "toy-browser-cli"
description = "The command line, and the Chrome DevTools Protocol front end."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "toy-browser"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
toy-browser.workspace = true
toy-browser-fetch.workspace = true
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
tungstenite = "0.30.0"
tiny_http = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
winit = "0.30"
softbuffer = "0.4"
# The other half of AccessKit: the one that talks to the desktop. Optional
# because it is the half with a platform in it — a session bus, an executor and
# a thread — and a build that only ever renders to a file has nothing to say to
# any of them. `--no-default-features` leaves the window with no accessibility
# and the rest of this crate unchanged.
accesskit_winit = { version = "0.34", optional = true }

[features]
default = ["a11y"]
a11y = ["dep:accesskit_winit"]

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }
rstest = "0.26.1"
thirtyfour = { version = "0.37.5", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
