# What `cargo deny check licenses` allows: the licences of every dependency of
# a release. See docs/release.md. MPL-2.0 is file-level copyleft: fine for
# dependencies we do not modify (the Stylo crates).
[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "allow"
