[workspace]
members = ["crates/fetch", "crates/engine", "crates/browser", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
serde_json = "1.0.151"
toy-browser-fetch = { path = "crates/fetch" }
toy-browser-engine = { path = "crates/engine" }
toy-browser = { path = "crates/browser" }
