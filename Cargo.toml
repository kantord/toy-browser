[workspace]
members = [
    "crates/fetch",
    "crates/rasterizer",
    "crates/engine",
    "crates/browser",
    "crates/cli",
    "crates/tui",
    "crates/e2e",
    # Somebody else's, kept here rather than pulled from crates.io. See
    # `vendor/README.md` for what was taken, from what, and what was changed.
    "vendor/blitz-dom",
    "vendor/blitz-html",
]
resolver = "3"
# Which package a bare `cargo run` means. There are two binaries in this
# workspace now — the browser and the TUI — and without this every `cargo run`
# in the justfile, the Playwright harness and the README stops with "could not
# determine which binary to run". `just tui` names its package, and `just build`
# says `--workspace`, so this narrows nothing anybody asked for.
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# `cognitive_complexity` is a nursery lint, so nothing turns it on by default.
# Asking for it here rather than in the hook means a plain `cargo clippy` sees
# it too — the check reports what the compiler already says, and adds nothing
# of its own. The threshold lives in `clippy.toml`, which is the only file
# clippy reads it from; a finding quotes it back as "(9/7)".
[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
fn_params_excessive_bools = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
serde_json = "1.0.151"
toy-browser-fetch = { path = "crates/fetch" }
toy-browser-rasterizer = { path = "crates/rasterizer" }
toy-browser-engine = { path = "crates/engine" }
toy-browser = { path = "crates/browser" }
