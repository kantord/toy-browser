# The budget for `cognitive-complexity`, which clippy reads for itself.
#
# It is not in `.claude/checks/limits.toml` with the others because clippy owns
# both the measurement and the comparison — the check only forwards what it
# says. A finding carries the number with it, as "(9/7)", so there is still one
# place to read it from.
#
# 5, against a tree whose worst function scores 7. Unlike the line budget, this
# one did not start at what the code already was: three attempts to trigger it
# from clean code all failed, because a competent author decomposes as they go.
# A threshold nothing can reach teaches nothing, so it was set below the four
# functions already over it — they report as `inherited`, and the conversation
# happens the first time anyone touches one. See docs/adr/0008.
#
# It comes down by deliberate commits, never up to make a finding go away.
cognitive-complexity-threshold = 5

# How long one function's body may be, counting neither comments nor blank
# lines — so it measures code, where `max_file_lines` deliberately measures
# prose as well. The two do not overlap: the worst offender here is 144 lines
# inside a 218-line file, which is invisible to a file budget of 320 and scores
# only 5 on complexity because it barely branches.
#
# 40 catches five functions. The floor is deliberately not settled: ratchet
# 40 -> 30 -> 25 -> 20 and judge from the extractions each notch forces. If they
# keep naming real concepts, keep going; when they start coming out as
# `write_node_part2`, that was the floor. See docs/adr/0008.
too-many-lines-threshold = 40

# Two bools in a signature usually means two callers sharing one body, which is
# the cause `cognitive-complexity` only ever sees as a symptom. One is enough to
# say so, and at 1 this fires exactly once in the whole tree.
max-fn-params-bools = 1
